<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkmate AI Practice</title>
</head>
<body>
    <h1>Welcome, {{ coach }}!</h1>

<p>You currently have {{ clients }} clients.</p>
</body>
</html>
<h2>Client List</h2>

{% for client in client_names %}
    <li>
        <a href="{{ url_for('client_profile', client_name=client) }}">
            {{ client.title() }}
        </a>
    </li>
{% else %}
    <li>No clients found yet.</li>
{% endfor %}
